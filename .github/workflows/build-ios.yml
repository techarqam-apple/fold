name: Build FoldLink iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/fold.xcworkspace \
            -scheme fold \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/FoldLink.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee build/xcodebuild.log

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-build-log
          path: build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/FoldLink.xcarchive/Products/Applications/fold.app build/Payload/fold.app
          cd build
          zip -r FoldLink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FoldLink-IPA
          path: build/FoldLink.ipa
          if-no-files-found: error
